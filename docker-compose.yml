# GERADO por scripts/gen_compose.py — não edite à mão.
name: tp2-etcd-sync
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command: [etcd, --name, s1, --data-dir, /etcd-data,
              --listen-client-urls, 'http://0.0.0.0:2379',
              --advertise-client-urls, 'http://etcd:2379']
    ports:
      - "${ETCD_HOST_PORT:-2379}:2379"

  observer:
    build: .
    image: tp2-etcd-sync:latest
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: python -m clustersync.observer
    volumes:
      - ./logs:/app/logs
    environment:
      OBSERVER_PORT: 8000
      LOG_DIR: /app/logs/${RUN_ID:-docker}

  node1:
    build: .
    image: tp2-etcd-sync:latest
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: python -m clustersync.node
    volumes:
      - ./logs:/app/logs
    depends_on: [etcd, observer]
    environment:
      NODE_ID: node1
      NODE_PORT: 9000
      ETCD_HOST: etcd
      ETCD_PORT: 2379
      OBSERVER_URL: http://observer:8000
      LOG_DIR: /app/logs/${RUN_ID:-docker}
      SYNC_MODE: ${SYNC_MODE:-etcd}
      SEED: ${SEED:-1}
      RUN_ID: ${RUN_ID:-docker}
      CS_MIN: ${CS_MIN:-0.2}
      CS_MAX: ${CS_MAX:-1.0}

  node2:
    build: .
    image: tp2-etcd-sync:latest
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: python -m clustersync.node
    volumes:
      - ./logs:/app/logs
    depends_on: [etcd, observer]
    environment:
      NODE_ID: node2
      NODE_PORT: 9000
      ETCD_HOST: etcd
      ETCD_PORT: 2379
      OBSERVER_URL: http://observer:8000
      LOG_DIR: /app/logs/${RUN_ID:-docker}
      SYNC_MODE: ${SYNC_MODE:-etcd}
      SEED: ${SEED:-1}
      RUN_ID: ${RUN_ID:-docker}
      CS_MIN: ${CS_MIN:-0.2}
      CS_MAX: ${CS_MAX:-1.0}

  node3:
